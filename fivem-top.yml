name: FiveM Top - Collector & Report

on:
  schedule:
    # Collector cada 10 minutos
    - cron: "*/10 * * * *"
    # Report cada 30 minutos (aprox, GitHub no garantiza el minuto exacto)
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña Actions

jobs:
  collect:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  report:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ secrets.DISCORD_MESSAGE_ID }}
